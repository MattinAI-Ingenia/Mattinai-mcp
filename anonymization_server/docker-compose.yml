version: '3.8'

services:
  # Your EXISTING MCP Tool Server
  anonymization_server:
    image: anonymization_server
    build:
      context: . # Assumes your server code is in this folder
      dockerfile: Dockerfile
    ports:
      - "7070:8000" # Host 7070 -> Container 8000
    networks:
      - ai-core-tools_app-network

networks:
  ai-core-tools_app-network:
    external: true